---
- name: Build extended UAMS_METADATA
  ansible.builtin.set_fact:
    uams_metadata_full: >-
      {{
        (
          [ansible_facts.env['UAMS_METADATA'] | default('')]
          + ["provisioner:ansible"]
        )
        | reject('equalto', '')
        | join(',')
      }}

- name: Build final UAMS environment variables
  ansible.builtin.set_fact:
    uams_environment: >-
      {{
        (ansible_facts.env
          | dict2items
          | selectattr('key', 'match', '^(UAMS_|SWO_URL)')
          | items2dict
        )
        | combine({'UAMS_METADATA': uams_metadata_full})
      }}