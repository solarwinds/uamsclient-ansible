---
- name: Include variable file
  ansible.builtin.include_vars:
    file: defaults/dbo_mapping.yml
  tags:
    - dbo

- name: Set expected plugins
  ansible.builtin.set_fact:
    expected_plugins: "{{ dbo_plugin | map(attribute='databaseType') | map('extract', dbo_mapping) | flatten | unique | list }}"
  tags:
    - dbo

- name: Debug expected plugins
  ansible.builtin.debug:
    var: expected_plugins
  tags:
    - dbo

- name: Read output of headless installer
  ansible.builtin.slurp:
    src: "{{ uams_local_pkg_path }}/output.json"
  register: output
  tags:
    - dbo

- name: Parse entity keys from headless installer output
  ansible.builtin.set_fact:
    entities: "{{ (output.content | b64decode | from_json).keys() | map('regex_replace', '^e-', '') | list }}"
  tags:
    - dbo

- name: Debug entities
  ansible.builtin.debug:
    var: entities
  tags:
    - dbo

# 1. Fetch all current plugins from endpoint and save the result
# 2. Filter response keeping only plugin keys present in expected_plugins
# 3. Iterate through each plugin key (each contains a map of instance keys)
# 4. For instances matching entities, verify status_code == STATUS_CODE_OK
- name: Fetch all plugins and verify DBO plugin statuses
  ansible.builtin.uri:
    url: http://127.0.0.1:2113/info/plugins?format=json
    method: GET
    return_content: true
    body_format: json
  register: plugins_result
  retries: 5
  delay: 12
  until: >-
    (plugins_result.json | default({}) | dict2items
      | selectattr('key', 'in', expected_plugins)
      | map(attribute='value')
      | map('dict2items')
      | flatten
      | selectattr('key', 'in', entities)
      | rejectattr('value.status_code', 'equalto', 'STATUS_CODE_OK')
      | list | length) == 0
    and
    (plugins_result.json | default({}) | dict2items
      | selectattr('key', 'in', expected_plugins)
      | map(attribute='value')
      | map('dict2items')
      | flatten
      | selectattr('key', 'in', entities)
      | list | length) > 0
  tags:
    - dbo

- name: Filter response to expected plugins
  ansible.builtin.set_fact:
    filtered_plugins: >-
      {{
        plugins_result.json
        | dict2items
        | selectattr('key', 'in', expected_plugins)
        | items2dict
      }}
  tags:
    - dbo

- name: Display verified DBO plugin statuses
  ansible.builtin.debug:
    var: filtered_plugins
  tags:
    - dbo
