---
- name: "Check status: {{ plugin }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:2113/info/plugins?format=json"
    method: GET
    return_content: true
    body_format: json
  register: result
  until: "result.json[plugin][instance]['status_code'] | default('') == 'STATUS_CODE_OK'"
  retries: 12
  delay: 5
  when: ansible_facts.os_family != 'Windows'

- name: "Check status (Windows): {{ plugin }}"
  ansible.windows.win_uri:
    url: "http://127.0.0.1:2113/info/plugins?format=json"
    method: GET
    return_content: true
  register: result_windows
  until: "(result_windows.content | from_json)[plugin][instance]['status_code'] | default('') == 'STATUS_CODE_OK'"
  retries: 12
  delay: 5
  when: ansible_facts.os_family == 'Windows'

- name: "Print plugin Status Code: {{ plugin }}"
  ansible.builtin.debug:
    var: result.json[plugin][instance]['status_code']
  when: ansible_facts.os_family != 'Windows'

- name: "Print plugin Status Code (Windows): {{ plugin }}"
  ansible.builtin.debug:
    msg: "{{ (result_windows.content | from_json)[plugin][instance]['status_code'] }}"
  when: ansible_facts.os_family == 'Windows'
